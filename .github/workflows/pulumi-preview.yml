name: Pulumi Preview

on:
  pull_request:
    paths:
      - '__main__.py'
      - 'Pulumi.*.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'functions/**'

jobs:
  preview:
    name: Preview (dev)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Pulumi preview
        id: preview
        run: |
          set -euo pipefail
          uv run pulumi preview --stack dev --non-interactive > /tmp/preview.txt 2>&1
          echo "status=success" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1

      - name: Postar resultado no PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/preview.txt')
              ? fs.readFileSync('/tmp/preview.txt', 'utf8')
              : '(sem output — preview não chegou a rodar)';
            const status = '${{ steps.preview.outputs.status }}' === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Pulumi Preview — stack \`dev\`\n\`\`\`\n${text.slice(0, 65000)}\n\`\`\``
            });
