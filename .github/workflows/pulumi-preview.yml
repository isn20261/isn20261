name: Pulumi Preview

on:
  pull_request:
    paths:
      - '__main__.py'
      - 'Pulumi.*.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'functions/**'

jobs:
  preview:
    name: Preview (${{ matrix.stack }})
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      # Preview both stacks independently. `fail-fast: false` so a failure on
      # one stack (e.g. a prod-only auth/permission issue) still lets the other
      # stack's preview run and report.
      fail-fast: false
      matrix:
        stack: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pulumi/setup-pulumi@v2

      - run: uv sync

      - name: Pulumi preview
        id: preview
        run: |
          set -euo pipefail
          uv run pulumi preview --stack ${{ matrix.stack }} --non-interactive 2>&1 | tee /tmp/preview.txt
          echo "status=success" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Postar resultado no PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const stack = '${{ matrix.stack }}';
            const text = fs.existsSync('/tmp/preview.txt')
              ? fs.readFileSync('/tmp/preview.txt', 'utf8')
              : '(sem output — preview não chegou a rodar)';
            const status = '${{ steps.preview.outputs.status }}' === 'success' ? '✅' : '❌';
            // One stable comment per stack (distinct marker) so dev and prod
            // each get their own updated-in-place comment instead of clobbering.
            const marker = `<!-- pulumi-preview-comment-${stack} -->`;
            const body = `${marker}\n## ${status} Pulumi Preview — stack \`${stack}\`\n\`\`\`\n${text.slice(0, 65000)}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
