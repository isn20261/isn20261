name: Deploy (dev-local)

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-local
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev-local        
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID:          ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:      ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:                 ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION:         ${{ secrets.AWS_DEFAULT_REGION }}
      PULUMI_CONFIG_PASSPHRASE:   ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_ACCESS_TOKEN:        ${{ secrets.PULUMI_ACCESS_TOKEN }}
      UV_PROJECT_ENVIRONMENT:     venv
      INTEGRATION_STACK:          dev
      # OAuth 2.0 / Google (issue #181). __main__.py reads these at `pulumi up`
      # and injects them into the Cognito Google IdP (secret-marked in state).
      GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend/web
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Pulumi up (pass 1 — provision infra)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: .
          refresh: true

      - name: Ler outputs do Pulumi
        run: |
          set -euo pipefail
          USER_POOL_ID="$(pulumi stack output user_pool_id --stack dev)"
          USER_POOL_CLIENT_ID="$(pulumi stack output user_pool_client_id --stack dev)"
          PUBLIC_URL="$(pulumi stack output public_url --stack dev)"
          CLOUDFRONT_ID="$(pulumi stack output cloudfront_id --stack dev)"
          COGNITO_DOMAIN="$(pulumi stack output cognito_hosted_ui_domain --stack dev)"
          : "${USER_POOL_ID:?}" : "${USER_POOL_CLIENT_ID:?}" : "${PUBLIC_URL:?}" : "${CLOUDFRONT_ID:?}" : "${COGNITO_DOMAIN:?}"
          # Register the deployed site's OAuth URLs alongside the committed
          # localhost entries ([0]). Pass 2 (pulumi up) applies them to the client.
          pulumi config set --path 'oauthCallbackUrls[1]' "$PUBLIC_URL/callback" --stack dev
          pulumi config set --path 'oauthLogoutUrls[1]'   "$PUBLIC_URL/login"    --stack dev
          {
            echo "NEXT_PUBLIC_COGNITO_REGION=sa-east-1"
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$USER_POOL_ID"
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID"
            echo "NEXT_PUBLIC_API_BASE_URL=$PUBLIC_URL"
            echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_ID"
            echo "NEXT_PUBLIC_COGNITO_DOMAIN=$COGNITO_DOMAIN"
            echo "NEXT_PUBLIC_OAUTH_REDIRECT_URI=$PUBLIC_URL/callback"
          } >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_COGNITO_REGION:              ${{ env.NEXT_PUBLIC_COGNITO_REGION }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID:        ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_API_BASE_URL:                ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_DOMAIN:              ${{ env.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_OAUTH_REDIRECT_URI:          ${{ env.NEXT_PUBLIC_OAUTH_REDIRECT_URI }}
        run: pnpm build

      - name: Pulumi up (pass 2 — sync frontend)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: .

      - name: Invalidar cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      # Cria o usuário de teste — usa suas credenciais, sem problema de permissão
      - name: Criar usuário de teste no Cognito
        env:
          USER_POOL_ID:  ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          CLIENT_ID:     ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
          TEST_EMAIL:    ${{ secrets.INTEGRATION_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.INTEGRATION_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          uv run python - <<'PYEOF'
          import os, boto3
          from botocore.exceptions import ClientError

          idp    = boto3.client("cognito-idp")
          pool   = os.environ["USER_POOL_ID"]
          email  = os.environ["TEST_EMAIL"]
          pwd    = os.environ["TEST_PASSWORD"]

          try:
              idp.admin_delete_user(UserPoolId=pool, Username=email)
          except ClientError as e:
              if e.response["Error"]["Code"] != "UserNotFoundException":
                  raise

          idp.admin_create_user(
              UserPoolId=pool,
              Username=email,
              TemporaryPassword=pwd,
              UserAttributes=[
                  {"Name": "email",          "Value": email},
                  {"Name": "email_verified", "Value": "true"},
              ],
              MessageAction="SUPPRESS",
          )
          idp.admin_set_user_password(
              UserPoolId=pool, Username=email, Password=pwd, Permanent=True
          )
          print(f"Usuário criado: {email}")
          PYEOF

      - name: Rodar testes de integração
        env:
          INTEGRATION_BASE_URL:      ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          INTEGRATION_USER_POOL_ID:  ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          INTEGRATION_CLIENT_ID:     ${{ env.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
          INTEGRATION_TEST_EMAIL:    ${{ secrets.INTEGRATION_TEST_EMAIL }}
          INTEGRATION_TEST_PASSWORD: ${{ secrets.INTEGRATION_TEST_PASSWORD }}
          INTEGRATION_STACK:         dev
        run: uv run pytest tests/integration/ -v
