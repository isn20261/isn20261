name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run ruff check functions/ tests/

      - run: uv run pytest -v --ignore=tests/integration/test_endpoints.py --cov=functions --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend/web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: frontend/web
        run: pnpm test
